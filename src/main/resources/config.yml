# NexusMobShield configuration.
#
# What this does: cancels the specific damage the vanilla /kill command produces (Bukkit calls
# it DamageCause.KILL), no matter who or what runs that command -- a player, the console, or a
# hidden command block you haven't found yet. Every other kind of damage (combat, fall, drowning,
# your other plugins' own effects) is completely untouched. This does not find or remove the
# rogue command blocks themselves -- it just makes /kill stop working against protected targets
# until you do. See NexusCmdTracker for actually locating and removing them.
#
# v0.2.0: registered at MONITOR priority (guaranteed to run last, unlike HIGHEST) and now also
# forces the damage to 0 alongside cancelling it. On top of that, a recovery safety net watches
# for protected mobs dying anyway and spawns a same-type replacement back in immediately -- so
# even if something out there still manages to kill a protected mob, it gets forced back into the
# game. CREEPER is exempt by default (the one mob allowed to stay killed); manage exemptions with
# /nexusmobshield exempt list|add <TYPE>|remove <TYPE>.

settings:
  # Master on/off switch. Also toggleable live with /nexusmobshield toggle.
  enabled: true
  # If true, /kill is blocked against players too, not just mobs -- recommended, since whatever
  # can run unauthorized /kill commands against mobs could just as easily be pointed at players
  # next. Use /nexusmobshield allow <seconds> any time YOU need to run a real /kill yourself.
  protect-players: true
  # Entity type names (Bukkit EntityType, e.g. ARMOR_STAND, ITEM_FRAME) that should NOT be
  # protected -- /kill (from any source) is always allowed to work against these. CREEPER is
  # exempt by default per your own request: it's the one mob you DO want a stray /kill to be able
  # to remove. Manage this live with /nexusmobshield exempt list|add <TYPE>|remove <TYPE> instead
  # of hand-editing this file -- that also persists the change back here immediately.
  exempt-entity-types: [CREEPER]
  # If true, this plugin sets the vanilla commandBlockOutput gamerule to false itself, on every
  # loaded world, at startup/reload (and again for any world that loads afterward) -- so a rogue
  # command block's own "Killed N entities" / "Successfully cloned 1 block(s)" feedback stops
  # flooding your console, without needing to run /gamerule by hand (which may not always be
  # reachable, depending on your console/panel setup). Toggle live with /nexusmobshield quiet <on|off>.
  silence-command-block-output: true

# A periodic summary instead of one message per blocked kill -- if whatever's doing this is
# firing fast, logging every single one would just become a second console-spam problem.
heartbeat:
  enabled: true
  summary-interval-seconds: 60

# Defense-in-depth safety net. If a protected, non-exempt mob dies anyway (its last recorded
# damage cause was exactly the blocked /kill), that means cancelling the event didn't hold --
# so a same-type replacement is spawned back in at the same spot a moment later. This only ever
# engages for a death actually caused by the blocked /kill; real combat, fall damage, drowning,
# lava, etc. always still result in a normal, permanent death.
recovery:
  enabled: true
  # Hard cap on recoveries per rolling minute, so a fast-firing /kill loop can't turn into a
  # runaway mob-spawning problem of its own. If you hit this cap regularly, that's a sign to go
  # find and remove whatever's running /kill (see NexusCmdTracker) rather than lean on recovery.
  max-per-minute: 40
