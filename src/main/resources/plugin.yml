name: NexusMobShield
version: '${project.version}'
main: com.nexuscraft.nexusmobshield.NexusMobShield
api-version: '1.21'
author: RealSociety
description: Blocks the vanilla /kill command against protected entities from every source (player, console, or a hidden command block), no matter who's running it or where it's hidden.
softdepend: [NexusHeartbeat]

commands:
  nexusmobshield:
    description: Check protection status, toggle it, open a temporary bypass window, or review what's been blocked.
    aliases: [mobshield, nms]
    usage: /nexusmobshield <status|toggle|allow [seconds]|log [count]|reload>
    permission: nexusmobshield.admin

permissions:
  nexusmobshield.admin:
    description: Manage NexusMobShield -- toggle protection, open a bypass window, and review the blocked-kill log.
    default: op
